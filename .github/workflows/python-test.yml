name: python-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: python-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          flake8 neptune_exporter.py neptune_modules tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 neptune_exporter.py neptune_modules tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          mkdir -p junit
          pytest -q tests/tests.py \
            --junitxml=junit/test-results.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.python-version }}
          path: |
            junit/test-results.xml
            coverage.xml
