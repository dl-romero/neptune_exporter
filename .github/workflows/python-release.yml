name: python-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: |
          pytest -q tests/tests.py

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          echo "current_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read changelog entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: ${{ steps.version.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/neptune_exporter-${{ github.ref_name }}.zip HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Neptune Exporter ${{ steps.version.outputs.current_version }}
          body: ${{ steps.changelog_reader.outputs.changes || 'See CHANGELOG.md for details.' }}
          files: dist/neptune_exporter-${{ github.ref_name }}.zip
          generate_release_notes: true